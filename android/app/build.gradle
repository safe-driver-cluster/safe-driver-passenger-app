plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Keep upload-key credentials outside source control. Existing local.properties
// entries remain supported while moving to the standard key.properties file.
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("key.properties")
if (!signingPropertiesFile.exists()) {
    signingPropertiesFile = rootProject.file("local.properties")
}
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def unsignedCompatibilityCheck = (project.findProperty("allowUnsignedRelease") ?:
        project.findProperty("ALLOWUNSIGNEDRELEASE")) == "true"

android {
    namespace = "com.codecrafters.safedriver"
    compileSdk = 36
    // NDK r28 builds native code with 16 KB page alignment by default.
    ndkVersion = "28.2.13676358"

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.codecrafters.safedriver"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            storeFile = signingProperties["storeFile"] ? file(signingProperties["storeFile"]) : null
            storePassword = signingProperties["storePassword"]
            keyAlias = signingProperties["keyAlias"]
            keyPassword = signingProperties["keyPassword"]
        }
    }

    buildTypes {
        release {
            // Unsigned output is only for local compatibility verification.
            // Normal release builds still require the real upload key.
            signingConfig unsignedCompatibilityCheck ? null : signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

if (!unsignedCompatibilityCheck) {
    def validateUploadKey = tasks.register("validateReleaseUploadKey") {
        doLast {
            def requiredKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
            if (requiredKeys.any { !signingProperties[it] } ||
                    !file(signingProperties["storeFile"]).exists()) {
                throw new GradleException("Release upload key is missing. Configure android/key.properties with your existing Play upload keystore.")
            }
        }
    }
    tasks.matching { it.name == "preReleaseBuild" }.configureEach {
        dependsOn(validateUploadKey)
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
